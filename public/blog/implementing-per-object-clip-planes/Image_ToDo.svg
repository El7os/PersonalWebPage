<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="440px" height="542px" viewBox="0 0 440 542" style="background: #ffffff; background-color: #ffffff; color-scheme: light;"><rect data-white-bg="1" x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
  <style>
    .box   { fill: light-dark(#ffffff, #121212); stroke: light-dark(#000000, #ffffff); stroke-width: 1; }
    .line  { fill: none; stroke: light-dark(#000000, #ffffff); stroke-width: 1; }
    .head  { fill: light-dark(#000000, #ffffff); stroke: none; }
    .title { fill: light-dark(#000000, #ffffff); font: bold 12px Helvetica, Arial, sans-serif; }
    .sub   { fill: light-dark(#444444, #bbbbbb); font: 11px Helvetica, Arial, sans-serif; }
    .label { fill: light-dark(#000000, #ffffff); font: 12px Helvetica, Arial, sans-serif; }
  </style>

  <!-- Stages -->
  <g text-anchor="middle">
    <rect class="box" x="1" y="1" width="258" height="58" rx="9" ry="9"/>
    <text class="title" x="130" y="26">Extending the Primitive Component</text>
    <text class="sub" x="130" y="43">Clip plane properties, getters and setters</text>

    <rect class="box" x="1" y="121" width="258" height="58" rx="9" ry="9"/>
    <text class="title" x="130" y="146">Scene Proxies</text>
    <text class="sub" x="130" y="163">Creation, recreation and in-place updates</text>

    <rect class="box" x="1" y="241" width="258" height="58" rx="9" ry="9"/>
    <text class="title" x="130" y="266">Sending the Data to the GPU</text>
    <text class="sub" x="130" y="283">Update requests, payload and serialization</text>

    <rect class="box" x="1" y="361" width="258" height="58" rx="9" ry="9"/>
    <text class="title" x="130" y="386">GPU Deserialization</text>
    <text class="sub" x="130" y="403">Unpacking into FPrimitiveSceneData</text>

    <rect class="box" x="1" y="481" width="258" height="58" rx="9" ry="9"/>
    <text class="title" x="130" y="506">Clipping Vertices</text>
    <text class="sub" x="130" y="523">Vertex shaders and vertex factories</text>
  </g>

  <!-- Arrows between stages -->
  <path class="line" d="M 130 59 L 130 113"/>
  <path class="head" d="M 130 120 L 126 112 L 134 112 Z"/>
  <path class="line" d="M 130 179 L 130 233"/>
  <path class="head" d="M 130 240 L 126 232 L 134 232 Z"/>
  <path class="line" d="M 130 299 L 130 353"/>
  <path class="head" d="M 130 360 L 126 352 L 134 352 Z"/>
  <path class="line" d="M 130 419 L 130 473"/>
  <path class="head" d="M 130 480 L 126 472 L 134 472 Z"/>

  <!-- Where each stage runs -->
  <path class="line" d="M 312 2 L 332 2 M 322 2 L 322 148 M 312 148 L 332 148"/>
  <text class="label" x="340" y="79">Game thread</text>

  <path class="line" d="M 312 152 L 332 152 M 322 152 L 322 328 M 312 328 L 332 328"/>
  <text class="label" x="340" y="244">Render thread</text>

  <path class="line" d="M 312 332 L 332 332 M 322 332 L 322 540 M 312 540 L 332 540"/>
  <text class="label" x="340" y="440">GPU</text>
</svg>
